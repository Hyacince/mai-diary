}

android {
    namespace 'cn.maidiary.app'
    compileSdk 35
    buildToolsVersion '35.0.1'

    defaultConfig {
        applicationId 'cn.maidiary.app'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.8.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
